<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="/css/bootstrap.css">
  <link rel="stylesheet" type="text/css" href="/css/cllama.css">
  <link rel="stylesheet" type="text/css" href="skills.css">
  <script src="/js/bootstrap.min.js"></script>
</head>
<body>
  <!-- Breadcrumb: always a way back to the chat page -->
  <nav aria-label="breadcrumb" class="skill-page-breadcrumb px-3 pt-2">
    <ol class="breadcrumb mb-1">
      <li class="breadcrumb-item"><a href="#" id="crumbChat"></a></li>
      <li class="breadcrumb-item active i18n" aria-current="page">expSkills</li>
    </ol>
  </nav>

  <div class="opane">
    <div class="alert alert-info small mb-3 i18n">skillHelp</div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="i18n mb-0">skillList</h5>
      <button id="b_add_skill" class="btn btn-primary i18n">addSkill</button>
    </div>
    <div id="skillListContainer" class="mb-4"></div>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="i18n mb-0">mcpServers</h5>
      <button id="b_add_mcp" class="btn btn-sm btn-compact btn-outline-primary i18n">addMcpServer</button>
    </div>
    <div id="mcpServersContainer" class="mb-2"></div>
    <div class="text-muted small mt-1 i18n">mcpServersHint</div>
  </div>

  <!-- MCP server editor modal -->
  <div class="modal fade" id="mcpModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title i18n" id="mcpModalTitle">addMcpServer</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="mcpServerId" value="">
          <div class="mb-3">
            <label for="mcpNameInput" class="form-label i18n">mcpServerName</label>
            <input type="text" class="form-control" id="mcpNameInput" maxlength="50" placeholder="my-server">
          </div>
          <div class="mb-3">
            <label for="mcpUrlInput" class="form-label i18n">mcpServerUrl</label>
            <input type="url" class="form-control" id="mcpUrlInput" placeholder="http://127.0.0.1:8000/mcp">
          </div>
          <div class="mb-3">
            <label for="mcpHeadersInput" class="form-label i18n">mcpServerHeaders</label>
            <textarea class="form-control font-monospace" id="mcpHeadersInput" rows="3" placeholder='{"Authorization": "Bearer ..."}'></textarea>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="mcpEnabledInput" checked>
            <label class="form-check-label i18n" for="mcpEnabledInput">mcpEnabled</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary me-auto i18n" id="b_test_mcp">mcpTestBtn</button>
          <button type="button" class="btn btn-secondary i18n" data-bs-dismiss="modal">close</button>
          <button type="button" class="btn btn-primary i18n" id="b_save_mcp">save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Skill editor modal -->
  <div class="modal fade" id="skillModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title i18n" id="skillModalTitle">addSkill</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="skillId" value="">
          <div class="mb-3">
            <label for="skillNameInput" class="form-label i18n">skillName</label>
            <input type="text" class="form-control" id="skillNameInput" maxlength="100">
          </div>
          <div class="mb-3">
            <label for="skillDescInput" class="form-label i18n">skillDescription</label>
            <input type="text" class="form-control" id="skillDescInput" maxlength="200">
          </div>
          <div class="mb-3">
            <label for="skillPromptInput" class="form-label i18n">skillPrompt</label>
            <textarea class="form-control" id="skillPromptInput" rows="4" maxlength="2000"></textarea>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="skillManualOnlyInput">
            <label class="form-check-label" for="skillManualOnlyInput">
              <span class="i18n">skillManualOnly</span>
              <div class="text-muted small i18n">skillManualOnlyHint</div>
            </label>
          </div>
          <div class="mb-3">
            <label class="form-label i18n">skillTools</label>
            <div class="d-flex justify-content-end mb-1">
              <button type="button" id="b_add_tool" class="btn btn-sm btn-compact btn-outline-secondary i18n">addTool</button>
            </div>
            <div id="toolRows"></div>
            <div class="text-muted small mt-1 i18n">skillToolsHint</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary i18n" data-bs-dismiss="modal">close</button>
          <button type="button" class="btn btn-primary i18n" id="b_save_skill">save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="skills.js" type="module"></script>
</body>
</html>
