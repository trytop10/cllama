  <div class="card">
    <div class="card-header">
        <div class="row">
          <div class="col"><h3 style="margin-bottom: 0px;padding-top: 3px;">cllama-<span class="i18n" i18n="text">settings</span></h3></div>
          <div class="col-auto ms-auto">
            <div class="nav-item dropdown">
              <button class="btn btn-link nav-link px-0 dropdown-toggle d-flex align-items-center" id="bd-theme" type="button" aria-expanded="false" data-bs-toggle="dropdown"
                data-bs-display="static" aria-label="Toggle theme (auto)">
                <svg class="bi me-2 theme-icon-active"><use href="#circle-half"></use></svg>
                <span class="d-none ms-2" id="bd-theme-text">Toggle theme</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="bd-theme-text">
                <li>
                  <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light" aria-pressed="false">
                    <svg class="bi me-2 opacity-50 theme-icon"><use href="#sun-fill"></use></svg>
                    Light
                  </button>
                </li>
                <li>
                  <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark" aria-pressed="false">
                    <svg class="bi me-2 opacity-50 theme-icon"><use href="#moon-stars-fill"></use></svg>
                    Dark
                  </button>
                </li>
                <li>
                  <button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="auto" aria-pressed="true">
                    <svg class="bi me-2 opacity-50 theme-icon" width="1em" height="1em">
                      <use href="#circle-half"></use></svg>
                    Auto
                    <svg class="bi ms-auto d-none" width="1em" height="1em">
                      <use href="#check2"></use></svg>
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </div>
    </div>
    <div class="card-body">

      <nav>
        <div class="nav nav-tabs" id="nav-tab" role="tablist">
          <a class="nav-link active i18n" id="aiserver-tab" data-bs-toggle="tab" href="#nav-aiserver" role="tab" aria-controls="nav-aiserver" aria-selected="true">api_configuration</a>
          <a class="nav-link i18n" id="insight-tab" data-bs-toggle="tab" href="#nav-insight" role="tab" aria-controls="nav-insight" aria-selected="false">Insightify</a>
          <a class="nav-link i18n" id="export-tab" data-bs-toggle="tab" href="#nav-export" role="tab" aria-controls="nav-export" aria-selected="false">export</a>
          <a class="nav-link i18n" id="import-tab" data-bs-toggle="tab" href="#nav-import" role="tab" aria-controls="nav-import" aria-selected="false">import</a>
        </div>
      </nav>
      <div class="tab-content" id="nav-tabContent">
        <div class="tab-pane opane fade show active" id="nav-aiserver" role="tabpanel" aria-labelledby="nav-aiserver-tab">
          <div class="api-config-header">
            <div>
              <h6 class="mb-1 fw-semibold i18n">apiProvidersTitle</h6>
              <p class="text-muted small mb-0 i18n">apiProvidersDesc</p>
            </div>
            <button type="button" class="btn btn-primary api-add-btn flex-shrink-0" id="b_add_api">
              <svg class="api-icon me-1"><use href="#plus"></use></svg><span class="i18n">apiAddProvider</span>
            </button>
          </div>

          <div id="apiProviderList" class="api-provider-list"></div>
          <div id="apiProviderEmpty" class="api-empty i18n d-none">apiEmptyProviders</div>
        </div>

        <div class="tab-pane opane fade" id="nav-insight" role="tabpanel" aria-labelledby="nav-insight-tab">
          
          <div class="mb-4">
            <label for="insightService" class="form-label i18n">insightServiceLabel</label>
            <select id="insightService" class="form-select"></select>
            <div id="insightSvcHint" class="text-info small mt-1 i18n d-none">apiConfigGuidance</div>
          </div>

          <div class="mb-4">
            <div class="d-flex align-items-center gap-2">
              <div class="form-check form-switch mb-0 wide-switch">
                <input class="form-check-input" type="checkbox" id="insightThink">
              </div>
              <label class="form-check-label i18n" for="insightThink" i18n="text">thinkModeLabel</label>
            </div>
            <div class="text-muted small mt-1 ms-2 i18n">thinkModeDesc</div>
          </div>
          <div class="mb-4">
            <label for="insightTemperature" class="form-label small mb-1 i18n">apiSettingsCreativityLabel</label>
            <div class="d-flex align-items-center gap-2">
              <input type="range" class="form-range flex-grow-1" id="insightTemperature" min="0" max="2" step="0.1" value="0.7">
              <span class="badge bg-primary rounded-pill flex-shrink-0" style="min-width:2.6em;" id="insightTemperatureValue">0.7</span>
            </div>
            <div class="text-muted small mt-1 i18n">apiSettingsCreativityDesc</div>
          </div>
          <div class="mb-4">
            <label for="insightTopP" class="form-label small mb-1 i18n">apiSettingsFocusLabel</label>
            <div class="d-flex align-items-center gap-2">
              <input type="range" class="form-range flex-grow-1" id="insightTopP" min="0" max="1" step="0.1" value="0.9">
              <span class="badge bg-primary rounded-pill flex-shrink-0" style="min-width:2.6em;" id="insightTopPValue">0.9</span>
            </div>
            <div class="text-muted small mt-1 i18n">apiSettingsFocusDesc</div>
          </div>

          <div class="d-flex justify-content-center mt-4">
            <a class="btn btn-primary w-50 i18n" id="b_save_insight">save</a>
          </div>
        </div>
        <div class="tab-pane  opane fade" id="nav-export" role="tabpanel" aria-labelledby="nav-export-tab">
            <div class="card-body">
              <form id="exportForm">
                  <div class="mb-4">
                      <div class="list-group">

                          <div class="list-group-item option-item py-2 selected">
                              <div class="form-check">
                                  <input class="form-check-input" type="checkbox" id="basicSettings" name="exportOptions" checked value="base">
                                  <label class="form-check-label i18n" for="basicSettings">expBaseData</label>
                              </div>
                          </div>
                          
                          <div class="list-group-item option-item py-2 selected">
                              <div class="form-check">
                                  <input class="form-check-input" type="checkbox" id="featureSettings" name="exportOptions" checked value="actionList">
                                  <label class="form-check-label i18n" for="featureSettings">expInsightTasks</label>
                              </div>
                          </div>
                          
                          <div class="list-group-item option-item py-2 selected">
                              <div class="form-check">
                                  <input class="form-check-input" type="checkbox" id="adaptationSettings" name="exportOptions" checked value="urls">
                                  <label class="form-check-label i18n" for="adaptationSettings">expCssSelector</label>
                              </div>
                          </div>

                          <div class="list-group-item option-item py-2 selected">
                              <div class="form-check">
                                  <input class="form-check-input" type="checkbox" id="guideSettings" name="exportOptions" checked value="chatTpaList">
                                  <label class="form-check-label i18n" for="guideSettings">expScenarioPresets</label>
                              </div>
                          </div>

                          <div class="list-group-item option-item py-2 selected">
                              <div class="form-check">
                                  <input class="form-check-input" type="checkbox" id="insightData" name="exportOptions" value="insightList">
                                  <label class="form-check-label i18n" for="insightData">expInsightData</label>
                              </div>
                          </div>

                          <div class="list-group-item option-item py-2 selected">
                              <div class="form-check">
                                  <input class="form-check-input" type="checkbox" id="chatData" name="exportOptions" value="chatData">
                                  <label class="form-check-label i18n" for="chatData">expChatRecords</label>
                              </div>
                          </div>

                          <div class="list-group-item option-item py-2 selected">
                              <div class="form-check">
                                  <input class="form-check-input" type="checkbox" id="skillData" name="exportOptions" value="skillList">
                                  <label class="form-check-label i18n" for="skillData">expSkills</label>
                              </div>
                          </div>

                          <div class="list-group-item option-item py-2 selected">
                              <div class="form-check">
                                  <input class="form-check-input" type="checkbox" id="mcpData" name="exportOptions" value="mcpServers">
                                  <label class="form-check-label i18n" for="mcpData">expMcpServers</label>
                              </div>
                          </div>
                      </div>
                  </div>
                  
                  <div class="d-flex justify-content-center mt-4">
                      <a href="#" id="a_export" class="btn btn-primary w-50 i18n">export</a>
                  </div>
                  <!-- How much the whole extension stores locally (chat history,
                       insights, skills…) — shown here because this tab is about
                       the user's data. Filled in by options.js. -->
                  <p class="text-muted small text-center mt-3 mb-0" id="storageUsage"></p>
              </form>
          </div>
        </div>
        <div class="tab-pane opane fade i18n" id="nav-import" role="tabpanel" aria-labelledby="nav-import-tab">

          <div class="container">
            <div class="text-center mt-5">
              <p class="text-muted mb-4 i18n">importPromptMsg1</p>
              <div class="mb-4">
                  <label for="jsonFile" class="file-input-label">
                      <h5 class="i18n">importPromptMsg2</h5>
                      <div id="fileName" class="file-name"></div>
                      <p class="text-muted small i18n">importPromptMsg3</p>
                  </label>
                  <input type="file" id="jsonFile" class="file-input" accept=".json">
              </div>
              
              <a id="b_upload" href="#" class="btn btn-primary w-50" style="padding: 0.5rem;">
                <svg class="bi me-2" style="vertical-align:-0.3rem;"><use href="#import"></use></svg><span class="i18n">import</span>
              </a>
            </div>

            <div class="alert alert-info mt-5 i18n">importWarnMsg1</div>

          </div>

        </div>
      </div>


    <!-- Add / edit one API provider. Kept in a modal so the list stays the
         main surface: add a provider, come back, see it in the list. -->
    <div class="modal fade" id="apiProviderModal" tabindex="-1" aria-labelledby="apiProviderModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="apiProviderForm" novalidate>
            <div class="modal-header">
              <h5 class="modal-title" id="apiProviderModalTitle"></h5>
              <button type="button" class="btn-close i18n" data-bs-dismiss="modal" aria-label="close" i18n="aria-label"></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label for="apiProviderType" class="form-label i18n">apiProviderLabel</label>
                <select id="apiProviderType" class="form-select" required></select>
              </div>

              <div class="mb-3">
                <label for="apiUrl" class="form-label i18n">apiEndpointLabel</label>
                <input type="text" class="form-control" id="apiUrl" inputmode="url" required autocomplete="off" spellcheck="false">
              </div>

              <div class="mb-3">
                <label for="apiKey" class="form-label i18n">apiKeyLabel</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="apiKey" autocomplete="off">
                  <button class="btn btn-outline-secondary i18n" type="button" id="togglePassword" tabindex="-1"
                          i18n="aria-label" aria-label="apiKeyLabel">
                    <svg class="bi"><use id="eyeOrEyeslash" href="#eye"></use></svg>
                  </button>
                </div>
              </div>

              <div class="mb-3">
                <label for="modelName" class="form-label i18n">apiModelLabel</label>
                <div class="input-group">
                  <input type="text" class="form-control i18n" i18n="placeholder" placeholder="apiModelPlaceholder"
                         id="modelName" list="modelNameList" required autocomplete="off" spellcheck="false">
                  <datalist id="modelNameList"></datalist>
                  <button class="btn btn-outline-secondary" type="button" id="b_fetch_models">
                    <svg class="api-icon"><use href="#arrow-repeat"></use></svg><span class="ms-1 i18n">apiFetchModels</span>
                  </button>
                </div>
                <div id="modelFetchStatus" class="text-muted small mt-1" role="status"></div>
              </div>

              <div class="mb-1">
                <label for="apiModelType" class="form-label i18n">apiModelTypeLabel</label>
                <select id="apiModelType" class="form-select"></select>
              </div>

              <div class="mt-3">
                <div class="form-label i18n">apiCapabilitiesLabel</div>
                <div class="d-flex flex-wrap gap-3">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="apiMultimodal">
                    <label class="form-check-label i18n" for="apiMultimodal">apiMultimodal</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="apiSupportsTools">
                    <label class="form-check-label i18n" for="apiSupportsTools">apiSupportsTools</label>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary i18n" data-bs-dismiss="modal">cancel</button>
              <button type="submit" class="btn btn-primary" id="b_save_api"><span class="i18n">save</span></button>
            </div>
          </form>
        </div>
      </div>
    </div>

    </div>
  </div>
  <script src="options.js" type="module"></script>
</body>
</html>
